<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PechHost – Giriş</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3fb;color:#12204a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(400px,92vw);background:#fff;border:2px solid #cfd9ee;border-radius:20px;padding:28px}
h1{margin:0 0 4px;font-size:1.6rem}
h1 a{color:inherit;text-decoration:none}
.sub{margin:0 0 20px;color:#55638a}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border:2px solid #cfd9ee;background:#fff;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;color:#12204a}
.tabs button.on{background:#2f4bff;border-color:#2f4bff;color:#fff}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:12px;border:2px solid #cfd9ee;border-radius:12px;font:inherit}
input:focus{outline:0;border-color:#2f4bff}
.main{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#2f4bff;color:#fff;font:inherit;font-weight:800;cursor:pointer}
.main:disabled{opacity:.5}
#msg{margin-top:14px;font-weight:600;min-height:1.4em}
.err{color:#c2331f}.ok{color:#0a7d4f}
.hide{display:none}
.suffix{color:#55638a;font-weight:600}
.back{display:block;margin-top:18px;text-align:center;color:#55638a;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <h1><a href="index.html">PechHost</a></h1>

  <div id="authBox">
    <p class="sub">Hesabına giriş yap veya yeni hesap oluştur.</p>
    <div class="tabs">
      <button id="tabLogin" class="on" type="button">Giriş yap</button>
      <button id="tabReg" type="button">Kayıt ol</button>
    </div>
    <form id="form">
      <div id="siteRow" class="hide">
        <label for="site">Site adı</label>
        <input id="site" placeholder="siteismi" autocapitalize="off">
        <small class="suffix">.pechhost.io</small>
      </div>
      <label for="email">E-posta</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="pass">Şifre</label>
      <input id="pass" type="password" minlength="6" required autocomplete="current-password">
      <button class="main" id="submit" type="submit">Giriş yap</button>
    </form>
    <a class="back" href="index.html">← Ana sayfaya dön</a>
  </div>

  <div id="panel" class="hide">
    <p class="sub">Hoş geldin!</p>
    <p id="who"></p>
    <button class="main" id="logout" type="button">Çıkış yap</button>
    <a class="back" href="index.html">← Ana sayfaya dön</a>
  </div>

  <div id="msg" role="status"></div>
</div>

<script>
const SUPABASE_URL = "https://srmymyusvpbzfptztcpd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_7xSuRh2KfDv4V3cMUY6t2Q_hsbUXoFd";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
let mode = "login";

function say(t, cls){ $("msg").textContent = t; $("msg").className = cls || ""; }

function setMode(m){
  mode = m;
  $("tabLogin").classList.toggle("on", m === "login");
  $("tabReg").classList.toggle("on", m === "register");
  $("siteRow").classList.toggle("hide", m !== "register");
  $("submit").textContent = m === "login" ? "Giriş yap" : "Kayıt ol";
  $("pass").autocomplete = m === "login" ? "current-password" : "new-password";
  say("");
}
$("tabLogin").onclick = () => setMode("login");
$("tabReg").onclick = () => setMode("register");

function showUser(user){
  $("authBox").classList.toggle("hide", !!user);
  $("panel").classList.toggle("hide", !user);
  if(user){
    const site = user.user_metadata && user.user_metadata.site;
    $("who").textContent = user.email + (site ? " • " + site + ".pechhost.io" : "");
  }
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("email").value.trim();
  const password = $("pass").value;
  $("submit").disabled = true;
  say("Bekleniyor...");

  if(mode === "register"){
    const site = $("site").value.trim().toLowerCase().replace(/[^a-z0-9-]/g, "");
    const { data, error } = await sb.auth.signUp({
      email, password,
      options: { data: { site } }
    });
    if(error) say(error.message, "err");
    else if(data.session) { say("Kayıt başarılı!", "ok"); showUser(data.user); }
    else say("Kayıt başarılı! E-postana gelen doğrulama linkine tıkla.", "ok");
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error) say("Giriş başarısız: " + error.message, "err");
    else { say("Giriş başarılı!", "ok"); showUser(data.user); }
  }
  $("submit").disabled = false;
});

$("logout").onclick = async () => {
  await sb.auth.signOut();
  showUser(null);
  say("Çıkış yapıldı.", "ok");
};

// index.html'den gelen bilgiyi oku
const params = new URLSearchParams(location.search);
if (params.get("mode") === "register" || params.get("site")) setMode("register");
if (params.get("site")) $("site").value = params.get("site").toLowerCase().replace(/[^a-z0-9-]/g, "");

sb.auth.getSession().then(({ data }) => showUser(data.session ? data.session.user : null));
sb.auth.onAuthStateChange((_e, session) => showUser(session ? session.user : null));
</script>
</body>
</html>
